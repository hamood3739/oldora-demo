
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>OLDORA | Vintage Marketplace</title>
  <style>
    :root {
      --gold: #c4a46a;
      --black: #101010;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--black);
      color: #f5f0e6;
      font-family: Georgia, serif;
      text-align: center;
    }

    header {
      padding: 45px 20px 25px;
      border-bottom: 1px solid #4b3d28;
    }

    .hourglass {
      font-size: 55px;
      color: var(--gold);
    }

    h1 {
      color: var(--gold);
      font-size: 46px;
      letter-spacing: 7px;
      margin: 12px 0;
    }

    .tagline {
      font-style: italic;
      color: #d6c5a6;
    }

    main {
      padding: 65px 22px;
    }

    h2 {
      color: var(--gold);
      font-size: 27px;
    }

    p {
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin: 12px 6px;
      padding: 14px 23px;
      border: 1px solid var(--gold);
      border-radius: 5px;
      color: var(--gold);
      text-decoration: none;
      font-family: Arial, sans-serif;
    }

    .button.primary {
      background: var(--gold);
      color: var(--black);
    }

    footer {
      padding: 25px;
      color: #a99b83;
      border-top: 1px solid #4b3d28;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="hourglass">⌛</div>
    <h1>OLDORA</h1>
    <p class="tagline">Every Item Has a Story</p>
  </header>

  <main>
    <h2>Discover Timeless Treasures</h2>
    <p>
      A marketplace dedicated to authentic
      vintage items at least 20 years old.
    </p>

    <a class="button primary" href="#coming-soon">
      Explore Collection
    </a>

    <a class="button" href="#coming-soon">
      Sell Your Vintage
    </a>

    <p id="coming-soon">
      Our marketplace is coming soon.
    </p>
  </main>

  <footer>
    OLDORA &copy; 2026
  </footer>
</body>
</html>
