<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLDORA | Your Account</title>
  <style>
    :root { --gold: #c4a46a; --black: #101010; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 35px 20px; min-height: 100vh; background: var(--black); color: #f5f0e6; font-family: Georgia, serif; text-align: center; }
    .logo { font-size: 44px; margin-bottom: 10px; }
    h1 { color: var(--gold); font-size: 40px; letter-spacing: 6px; margin: 10px 0; }
    .tagline { color: #d6c5a6; font-style: italic; }
    .panel { max-width: 420px; margin: 40px auto; padding: 28px 22px; border: 1px solid #59492f; border-radius: 12px; text-align: left; }
    h2 { color: var(--gold); text-align: center; }
    label { display: block; margin: 18px 0 8px; }
    input { width: 100%; padding: 14px; background: #202020; border: 1px solid #766448; border-radius: 6px; color: white; font-size: 16px; }
    button { width: 100%; margin-top: 24px; padding: 15px; background: var(--gold); border: none; border-radius: 6px; color: var(--black); font-size: 17px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .switch { color: var(--gold); text-align: center; margin-top: 20px; cursor: pointer; text-decoration: underline; }
    .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    .note { color: #b9ad98; font-size: 13px; line-height: 1.7; }
    a { color: var(--gold); }
    html[dir="rtl"] .panel { text-align: right; }
    html[dir="rtl"] body { font-family: Tahoma, Arial, sans-serif; }
    html[dir="rtl"] h1 { font-family: Georgia, serif; }
    .language-switch { width:auto; padding:9px 17px; margin:5px auto 0; background:transparent; border:1px solid var(--gold); color:var(--gold); }
    #email, #password { direction:ltr; text-align:left; }
  
/* Approved OLDORA artwork across all pages */
html{min-height:100%;background:#080808}
body{min-height:100vh;background-color:#080808!important;background-image:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.77) 65%,#080808),url('assets/oldora-vintage-background.webp')!important;background-position:center top!important;background-repeat:no-repeat!important;background-size:100% auto!important;background-attachment:scroll!important}
@media(max-width:650px){body{background-size:auto,auto 580px!important;background-position:center top,center 110px!important}}

/* OLDORA full-viewport artwork: stays visible while every page scrolls. */
html{background:#080808!important}
body{position:relative;isolation:isolate;min-height:100vh;background:#080808!important;background-image:none!important}
body::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background-image:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.64)),url("assets/oldora-vintage-background.webp");background-position:center center;background-repeat:no-repeat;background-size:cover}
@media(max-width:650px){body::before{background-position:44% center;background-size:cover}}

/* Auth page visual polish: a single compact logo, readable form, no background text collision. */
body{padding:22px 16px 44px!important;overflow-x:hidden}
body::before{background-image:linear-gradient(180deg,rgba(0,0,0,.86),rgba(0,0,0,.83)),url("assets/oldora-vintage-background.webp")!important;background-position:center center!important}
body>.logo{display:flex;justify-content:center;align-items:center;margin:0 auto 6px!important;min-height:0!important}
body>.logo .oldora-official-logo{width:clamp(108px,30vw,148px)!important;height:clamp(108px,30vw,148px)!important;aspect-ratio:1/1;object-fit:cover!important;object-position:center!important;border-radius:50%!important;margin:0 auto!important;display:block!important}
body>h1.oldora-logo-heading{display:none!important}
#languageSwitch{display:block!important;width:auto!important;margin:8px auto 22px!important;padding:9px 18px!important;font-size:15px!important}
.panel{position:relative;max-width:430px;margin:12px auto 22px!important;padding:24px 20px!important;background:rgba(9,9,9,.91)!important;border:1px solid #766044!important;box-shadow:0 14px 36px rgba(0,0,0,.45);border-radius:14px!important}
.panel h2{margin:4px 0 22px!important;font-size:clamp(24px,6vw,30px)!important}
.panel label{margin:14px 0 7px!important}
.panel input{background:#202020!important}
@media(max-width:420px){.panel{padding:21px 17px!important}.panel h2{font-size:25px!important}}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="logo">⌛</div>
  <h1>OLDORA</h1>
  <button id="languageSwitch" class="language-switch" type="button">العربية</button>
  <section class="panel">
    <h2 id="heading">Create Account</h2>
    <form id="accountForm">
      <label for="email" data-i18n="email">Email Address</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password" data-i18n="password">Password</label>
      <input id="password" type="password" minlength="12" required>
      <p class="note" data-i18n="passwordHint">Use at least 12 characters, including uppercase and lowercase letters and a number.</p>
      <button id="submitBtn" type="submit">Sign Up</button>
    </form>
    <p class="switch" id="switchMode" role="button" tabindex="0">Already have an account? Log In</p>
    <p class="note" id="message" role="status" aria-live="polite"></p>
  </section>
  <p><a href="index.html" data-i18n="back">Back to OLDORA</a></p>
  <script>
    const supabaseUrl = 'https://hakjlkltjwvatzgasvos.supabase.co';
    const supabaseKey = 'sb_publishable_ZHSA7hEPPW7GCZUwZMDWKg_2fewANzb';
    let supabaseClient;
    let signUpMode = false;
    const heading = document.getElementById('heading');
    const submitBtn = document.getElementById('submitBtn');
    const switchMode = document.getElementById('switchMode');
    const message = document.getElementById('message');
    const passwordInput = document.getElementById('password');
    const authText = {
      en: {email:'Email Address',password:'Password',passwordHint:'Use at least 12 characters, including uppercase and lowercase letters and a number.',back:'Back to OLDORA',create:'Create Account',welcome:'Welcome Back',signup:'Sign Up',login:'Log In',have:'Already have an account? Log In',newAccount:'New to OLDORA? Create Account',wait:'Please wait...',created:'Account created. Please check your email if confirmation is required.',connection:'Connection error. Please try again.',library:'Supabase library did not load.'},
      ar: {email:'البريد الإلكتروني',password:'كلمة المرور',passwordHint:'استخدم ١٢ حرفًا على الأقل، تتضمن أحرفًا إنجليزية كبيرة وصغيرة ورقمًا.',back:'العودة إلى OLDORA',create:'إنشاء حساب',welcome:'مرحبًا بعودتك',signup:'إنشاء الحساب',login:'تسجيل الدخول',have:'لديك حساب بالفعل؟ سجّل الدخول',newAccount:'ليس لديك حساب؟ أنشئ حسابًا',wait:'يرجى الانتظار...',created:'تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا كان تأكيد الحساب مطلوبًا.',connection:'خطأ في الاتصال. حاول مرة أخرى.',library:'تعذر تحميل خدمة تسجيل الدخول.'}
    };
    let authLanguage = localStorage.getItem('oldora_language') === 'en' ? 'en' : 'ar';
    function authLabel(key) { return authText[authLanguage][key]; }
    function applyAuthLanguage(lang) {
      authLanguage = lang === 'ar' ? 'ar' : 'en';
      localStorage.setItem('oldora_language', authLanguage);
      document.documentElement.lang = authLanguage;
      document.documentElement.dir = authLanguage === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('languageSwitch').textContent = authLanguage === 'ar' ? 'English' : 'العربية';
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = authLabel(el.dataset.i18n); });
      heading.textContent = authLabel(signUpMode ? 'create' : 'welcome');
      submitBtn.textContent = authLabel(signUpMode ? 'signup' : 'login');
      switchMode.textContent = authLabel(signUpMode ? 'have' : 'newAccount');
    }
    document.getElementById('languageSwitch').addEventListener('click', () => applyAuthLanguage(authLanguage === 'ar' ? 'en' : 'ar'));
    applyAuthLanguage(authLanguage);
    passwordInput.minLength = 1;
    const requestedNext = new URLSearchParams(location.search).get('next');
    const isEmailConfirmation = new URLSearchParams(location.search).get('verified') === '1';
    const safeNext = isEmailConfirmation ? 'index.html' : (requestedNext && /^messages\.html(?:\?(?:product|listing)=[0-9]+)?$/.test(requestedNext) ? requestedNext : 'dashboard.html');
    // Returning sellers should see Log In, not the Create Account form.
    (async () => {
      try {
        if (!window.supabase) return;
        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        const { data, error } = await supabaseClient.auth.getSession();
        if (!error && data?.session?.user) {
          window.location.replace(safeNext);
        }
      } catch (error) {
        console.warn('Session check unavailable; login form remains accessible.');
      }
    })();
    // Diagnose browser storage without exposing credentials or session tokens.
    function sessionStorageCheck() {
      try {
        const key = 'oldora_storage_test';
        localStorage.setItem(key, 'ok');
        const works = localStorage.getItem(key) === 'ok';
        localStorage.removeItem(key);
        return works;
      } catch (_) { return false; }
    }
    const storageAvailable = sessionStorageCheck();
    if (!storageAvailable) {
      message.textContent = authLanguage === 'ar'
        ? 'Safari يمنع تخزين جلسة الدخول. افتح الموقع في تبويب Safari عادي (ليس خاصًا)، وتأكد من السماح ببيانات المواقع.'
        : 'Safari cannot save this login session. Open OLDORA in a regular Safari tab (not Private Browsing) and allow website data.';
    }
    function toggleMode() {
      signUpMode = !signUpMode;
      heading.textContent = authLabel(signUpMode ? 'create' : 'welcome');
      submitBtn.textContent = authLabel(signUpMode ? 'signup' : 'login');
      switchMode.textContent = authLabel(signUpMode ? 'have' : 'newAccount');
      passwordInput.minLength = signUpMode ? 12 : 1;
      message.textContent = '';
    }
    switchMode.addEventListener('click', toggleMode);
    switchMode.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleMode();
      }
    });
    document.getElementById('accountForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      submitBtn.disabled = true;
      message.textContent = authLabel('wait');
      try {
        if (!supabaseClient) {
          if (!window.supabase) throw new Error(authLabel('library'));
          supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        }
        const result = signUpMode
          ? await supabaseClient.auth.signUp({ email, password, options: { emailRedirectTo: new URL('auth.html?verified=1', window.location.href).href } })
          : await supabaseClient.auth.signInWithPassword({ email, password });
        if (result.error) {
          message.textContent = result.error.message;
        } else if (signUpMode) {
          message.textContent = authLabel('created');
        } else {
          const { data: persisted, error: sessionCheckError } = await supabaseClient.auth.getSession();
          if (sessionCheckError || !persisted?.session?.user || !storageAvailable) {
            message.textContent = authLanguage === 'ar'
              ? 'تم قبول بيانات الحساب، لكن Safari لم يتمكن من الاحتفاظ بجلسة الدخول. افتح OLDORA في تبويب عادي وتحقق من إعدادات بيانات المواقع.'
              : 'Credentials accepted, but Safari could not retain the login session. Use a regular Safari tab and check website-data settings.';
          } else {
            window.location.replace(safeNext);
          }
        }
      } catch (error) {
        message.textContent = error.message || authLabel('connection');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
<script defer src="oldora-logo.js?v=20261122d"></script></body>
</html>
