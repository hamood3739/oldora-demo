<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Messages | OLDORA</title><style>:root{--gold:#c4a46a;--line:#59482f}*{box-sizing:border-box}body{background:#101010;color:#eee6d9;font-family:Arial,sans-serif;margin:0}header,main{max-width:850px;margin:auto;padding:14px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}header .header-actions{display:flex;gap:8px;align-items:center}#oldoraLanguageSwitch{position:static!important;bottom:auto!important;right:auto!important;left:auto!important;box-shadow:none!important;padding:8px 10px!important;font-size:13px!important}header .header-actions a{font-size:13px}a{color:var(--gold)}h1,h2{font-family:Georgia,serif;color:var(--gold)}#threads:empty{display:none}#conversationsPanel:has(#threads:empty){display:none}#chat{min-height:calc(100dvh - 190px);display:flex;flex-direction:column}#conversationsPanel[hidden]{display:none!important}#chat #sendForm{margin-top:auto;padding-top:12px}#chat .messages{flex:1;min-height:0}#chat:not(.active) #productPreview,#chat:not(.active) #heading{display:none}.panel{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#1a1917}main h1{font-size:22px;margin:10px 0}h2{font-size:16px;margin:0 0 10px}.thread{display:block;width:100%;text-align:left;background:#26221c;color:#eee6d9;border:1px solid var(--line);padding:10px;border-radius:8px;margin:6px 0}.messages{min-height:125px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#41351f}.theirs{align-self:flex-start;background:#292723}small{display:block;color:#c5b89e;margin-top:6px}textarea{width:100%;background:#272521;color:white;border:1px solid var(--line);padding:12px;border-radius:8px;font:16px Arial;resize:vertical}button{cursor:pointer}button.primary{background:var(--gold);color:#16120e;border:0;border-radius:7px;padding:10px 14px;margin-top:0}button:disabled{opacity:.5}#chat[hidden],#status[hidden]{display:none!important}#body{display:block;min-height:44px;height:48px;max-height:120px;user-select:text;-webkit-user-select:text;touch-action:manipulation;resize:vertical}#sendForm{display:flex;gap:8px;align-items:flex-end;margin-top:10px}#sendForm textarea{flex:1;min-width:0}#send{flex:none;white-space:nowrap}#refresh{background:transparent;border:1px solid var(--line);color:var(--gold);font-size:12px;padding:6px 9px;margin-top:8px}#chat:not(.active) #sendForm{opacity:.65}#chat:not(.active) #heading{display:none}@media(max-width:500px){header,main{padding:12px}header a:first-child{font-size:21px!important}.panel{padding:10px}#productPhoto{width:48px!important;height:48px!important}.bubble{max-width:90%}}#productPreview{display:flex;align-items:center;gap:12px;margin-bottom:14px}#productPreview[hidden]{display:none}#productPhoto{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}#productName{font-weight:bold;color:var(--gold);overflow-wrap:anywhere}#productPrice{margin-top:5px}#chat:not(.active) .messages{display:none}#chat:not(.active) #refresh{display:none}#oldoraSoundSettings,#oldoraSoundMount{display:none!important}#oldoraSoundSettings h2{font:600 14px Arial,sans-serif;margin:0 0 8px}#oldoraSoundSettings label{display:inline-flex;align-items:center;gap:5px;margin:4px 12px 4px 0}#oldoraSoundTest{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}.note{color:#c4b69f;line-height:1.6}#status{min-height:24px}</style></head><body><header><a href="./" style="font:bold 24px Georgia;text-decoration:none;letter-spacing:3px">⌛ OLDORA</a><div class="header-actions"><a href="dashboard.html">Seller Dashboard</a><a href="settings.html">⚙️ Settings</a><button id="oldoraLanguageSwitch" type="button" aria-label="Switch language">العربية</button></div></header><main><h1>Private Messages</h1><p id="status" role="status" class="note" hidden></p><section class="panel" id="conversationsPanel"><h2>Conversations</h2><div id="threads"></div></section><section class="panel" id="chat"><div id="productPreview" hidden><img id="productPhoto" alt="Product photograph" hidden><div><div id="productName"></div><div id="productPrice"></div></div></div><h2 id="heading" hidden>Conversation</h2><div class="messages" id="messages" aria-live="polite"></div><form id="sendForm"><textarea id="body" rows="1" maxlength="2000" aria-label="Your message" required disabled placeholder="Select a chat..."></textarea><button class="primary" id="send" type="submit" disabled>Send</button></form><button class="primary" id="refresh" type="button">↻ Refresh</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://hakjlkltjwvatzgasvos.supabase.co','sb_publishable_ZHSA7hEPPW7GCZUwZMDWKg_2fewANzb');
const status=document.getElementById('status'),threads=document.getElementById('threads'),chat=document.getElementById('chat'),msgs=document.getElementById('messages');let user=null,active=null,all=[];let pollHandle=null;chat.classList.remove('active');
function say(s){status.textContent=s;status.hidden=!s||/^(No conversations yet|لا توجد محادثات بعد|Your conversations are ready|محادثاتك جاهزة|Select a conversation above|اختر محادثة أعلاه)/.test(s)}function err(e){say(e?.message||'Something went wrong.')}
async function list(){const {data,error}=await db.from('oldora_conversations').select('id,product_id,buyer_id,seller_id,created_at').order('created_at',{ascending:false});if(error)throw error;all=data||[];const listing=new URLSearchParams(location.search).get('listing');const visible=listing?all.filter(c=>String(c.product_id)===listing):all;document.getElementById('conversationsPanel').hidden=visible.length===0;threads.replaceChildren();for(const c of visible){const b=document.createElement('button');b.className='thread';b.textContent='Item #'+c.product_id+' · '+(c.buyer_id===user.id?'Buyer':'Seller');b.onclick=()=>{open(c.id);};threads.append(b)}}
async function showProduct(id){
 const preview=document.getElementById('productPreview'),photo=document.getElementById('productPhoto');
 preview.hidden=true;photo.hidden=true;photo.removeAttribute('src');
 const {data,error}=await db.from('products').select('id,title,price,image_path').eq('id',id).eq('status','approved').maybeSingle();
 if(error||!data){document.getElementById('productName').textContent='Item #'+id;document.getElementById('productPrice').textContent='';preview.hidden=false;return;}
 document.getElementById('productName').textContent=data.title||'Item #'+id;
 document.getElementById('productPrice').textContent='SAR '+Number(data.price||0).toFixed(2);
 if(typeof data.image_path==='string'&&data.image_path&&!data.image_path.includes('..')&&!data.image_path.includes('://')&&!data.image_path.startsWith('/')){
   photo.src=db.storage.from('approved-product-media').getPublicUrl(data.image_path).data.publicUrl;
   photo.onerror=()=>{photo.hidden=true};photo.hidden=false;
 }
 preview.hidden=false;
}
async function open(id){const c=all.find(x=>x.id===id);if(!c)return;if(active!==id){msgs.dataset.loaded='';msgs.dataset.lastIncomingId='';lastIncomingSoundId=''}active=id;chat.classList.add('active');document.getElementById('heading').hidden=true;document.getElementById('body').disabled=false;document.getElementById('body').placeholder='Write your message...';document.getElementById('send').disabled=false;document.getElementById('heading').textContent='Conversation about item #'+c.product_id;try{await showProduct(c.product_id)}catch(e){console.warn('Product preview unavailable',e)}await refresh();if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(()=>{if(active)refresh()},4000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)refresh()});window.addEventListener('pageshow',()=>{if(active)refresh()});
let refreshBusy=false;let lastIncomingSoundId='';
async function refresh(){if(!active||refreshBusy)return;refreshBusy=true;try{
const requested=active;const {data,error}=await db.from('oldora_messages').select('id,sender_id,body,created_at').eq('conversation_id',requested).order('created_at',{ascending:true}).limit(200);
if(requested!==active)return;if(error){err(error);return}
const rows=data||[],newest=rows.at(-1),wasLoaded=msgs.dataset.loaded==='yes';
const incoming=rows.filter(m=>m.sender_id!==user.id);
const newestIncoming=incoming.at(-1);
const previousIncoming=msgs.dataset.lastIncomingId||'';
if(wasLoaded&&newestIncoming&&previousIncoming&&String(newestIncoming.id)!==previousIncoming&&lastIncomingSoundId!==String(newestIncoming.id)&&document.visibilityState==='visible'){
 lastIncomingSoundId=String(newestIncoming.id);window.OLDORASound?.play('messages');
}
msgs.dataset.lastIncomingId=newestIncoming?String(newestIncoming.id):'';
msgs.dataset.loaded='yes';
msgs.replaceChildren();for(const m of rows){const el=document.createElement('div');el.className='bubble '+(m.sender_id===user.id?'mine':'theirs');const t=document.createElement('div');t.textContent=m.body;const time=document.createElement('small');time.textContent=new Date(m.created_at).toLocaleString();el.append(t,time);msgs.append(el)}if(!rows.length)msgs.textContent='';msgs.scrollTop=msgs.scrollHeight
}finally{refreshBusy=false}}
document.getElementById('refresh').onclick=refresh;
document.getElementById('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!document.getElementById('send').disabled&&document.getElementById('body').value.trim())document.getElementById('sendForm').requestSubmit()}});
document.getElementById('sendForm').onsubmit=async e=>{e.preventDefault();if(!active){say('Select a conversation first.');return}const input=document.getElementById('body'),body=input.value.trim(),btn=document.getElementById('send');if(!body||body.length>2000)return;btn.disabled=true;try{const {error}=await db.from('oldora_messages').insert({conversation_id:active,sender_id:user.id,body});if(error)throw error;input.value='';say('Message sent.');await refresh()}catch(error){err(error)}finally{btn.disabled=false;input.focus()}};
(async()=>{try{const res=await db.auth.getSession();if(res.error)throw res.error;user=res.data.session?.user||null;if(!user){say('Please sign in to use messages.');const a=document.createElement('a');a.href='auth.html?next='+encodeURIComponent('messages.html'+location.search);a.textContent='Sign in';status.append(' ',a);return}await list();const params=new URLSearchParams(location.search);if(all.length===1 || (params.get('inbox')==='1'&&all.length)){await open(all[0].id)}const listing=params.get('listing');if(listing){if(!/^[1-9]\d{0,17}$/.test(listing))throw Error('Invalid listing');const matching=all.filter(c=>String(c.product_id)===listing);if(matching.length===1)await open(matching[0].id)}const id=new URLSearchParams(location.search).get('product');if(id){if(!/^[1-9]\d{0,17}$/.test(id))throw Error('Invalid product');const {data,error}=await db.rpc('oldora_start_conversation',{p_product_id:Number(id)});if(error){if(/cannot message yourself/i.test(error.message||'')){say('This is your own listing. Buyers can start a chat from its product page; their messages will appear here.');return}throw error}await list();await open(data)}say('')}catch(e){err(e);if(/relation|schema cache|function .*does not exist/i.test(e.message||''))say('Messaging is being prepared. Please check back later.')}})();
</script><script defer src="oldora-sounds.js?v=3"></script><script defer src="oldora-i18n.js?v=20261116top-v3"></script><script defer src="oldora-notifications.js?v=2"></script></body></html>
