<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Messages | OLDORA</title><style>:root{--gold:#c4a46a;--line:#59482f}*{box-sizing:border-box}body{background:#101010;color:#eee6d9;font-family:Arial,sans-serif;margin:0}header,main{max-width:850px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}a{color:var(--gold)}h1,h2{font-family:Georgia,serif;color:var(--gold)}.panel{border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0;background:#1a1917}.thread{display:block;width:100%;text-align:left;background:#26221c;color:#eee6d9;border:1px solid var(--line);padding:14px;border-radius:8px;margin:8px 0}.messages{min-height:180px;max-height:450px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#41351f}.theirs{align-self:flex-start;background:#292723}small{display:block;color:#c5b89e;margin-top:6px}textarea{width:100%;background:#272521;color:white;border:1px solid var(--line);padding:12px;border-radius:8px;font:16px Arial;resize:vertical}button{cursor:pointer}button.primary{background:var(--gold);color:#16120e;border:0;border-radius:7px;padding:12px 22px;margin-top:10px}button:disabled{opacity:.5}#chat[hidden]{display:none}#body{display:block;min-height:105px;user-select:text;-webkit-user-select:text;touch-action:manipulation}#chatHint{margin:12px 0}.note{color:#c4b69f;line-height:1.6}#status{min-height:24px}</style></head><body><header><a href="./" style="font:bold 24px Georgia;text-decoration:none;letter-spacing:3px">⌛ OLDORA</a><a href="dashboard.html">Seller Dashboard</a></header><main><h1>Private Messages</h1><p id="status" role="status" class="note" hidden></p><section class="panel"><h2>Conversations</h2><div id="threads"></div><p class="note" id="chatHint" role="status">اختر محادثة للكتابة وإرسال الرسائل. تبدأ المحادثة من زر المحادثة أسفل الإعلان المنشور والمتحقق من عمره.</p></section><section class="panel" id="chat" hidden><h2 id="heading">Conversation</h2><div class="messages" id="messages" aria-live="polite"></div><form id="sendForm"><label for="body">Your message</label><textarea id="body" rows="3" maxlength="2000" required placeholder="Write your message..."></textarea><button class="primary" id="send" type="submit">Send Message</button></form><button class="primary" id="refresh" type="button">Refresh Messages</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://hakjlkltjwvatzgasvos.supabase.co','sb_publishable_ZHSA7hEPPW7GCZUwZMDWKg_2fewANzb');
const status=document.getElementById('status'),threads=document.getElementById('threads'),chat=document.getElementById('chat'),msgs=document.getElementById('messages');let user=null,active=null,all=[];let pollHandle=null;
function say(s){status.textContent=s;status.hidden=!s||/^(No conversations yet|لا توجد محادثات بعد|Your conversations are ready|محادثاتك جاهزة|Select a conversation above|اختر محادثة أعلاه)/.test(s)}function err(e){say(e?.message||'Something went wrong.')}
async function list(){const {data,error}=await db.from('oldora_conversations').select('id,product_id,buyer_id,seller_id,created_at').order('created_at',{ascending:false});if(error)throw error;all=data||[];const listing=new URLSearchParams(location.search).get('listing');const visible=listing?all.filter(c=>String(c.product_id)===listing):all;threads.replaceChildren();if(!visible.length)threads.textContent=listing?'لا توجد محادثات لهذا الإعلان بعد.':'لا توجد محادثات بعد.';for(const c of visible){const b=document.createElement('button');b.className='thread';b.textContent='Item #'+c.product_id+' · '+(c.buyer_id===user.id?'You are the buyer':'You are the seller')+' · Private chat';b.onclick=()=>open(c.id);threads.append(b)}}
async function open(id){const c=all.find(x=>x.id===id);if(!c)return;active=id;chat.hidden=false;document.getElementById('body').disabled=false;document.getElementById('send').disabled=false;document.getElementById('heading').textContent='Conversation about item #'+c.product_id;await refresh();document.getElementById('body').focus();if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(()=>{if(!document.hidden&&active)refresh()},12000)}
async function refresh(){if(!active)return;const {data,error}=await db.from('oldora_messages').select('id,sender_id,body,created_at').eq('conversation_id',active).order('created_at',{ascending:true}).limit(200);if(error){err(error);return}msgs.replaceChildren();for(const m of data||[]){const el=document.createElement('div');el.className='bubble '+(m.sender_id===user.id?'mine':'theirs');const t=document.createElement('div');t.textContent=m.body;const time=document.createElement('small');time.textContent=new Date(m.created_at).toLocaleString();el.append(t,time);msgs.append(el)}if(!data?.length)msgs.textContent='ابدأ المحادثة.';msgs.scrollTop=msgs.scrollHeight}
document.getElementById('refresh').onclick=refresh;
document.getElementById('sendForm').onsubmit=async e=>{e.preventDefault();if(!active){say('اختر محادثة أولًا.');return}const input=document.getElementById('body'),body=input.value.trim(),btn=document.getElementById('send');if(!body||body.length>2000)return;btn.disabled=true;try{const {error}=await db.from('oldora_messages').insert({conversation_id:active,sender_id:user.id,body});if(error)throw error;input.value='';say('تم إرسال الرسالة.');await refresh()}catch(error){err(error)}finally{btn.disabled=false;input.focus()}};
(async()=>{try{const res=await db.auth.getSession();if(res.error)throw res.error;user=res.data.session?.user||null;if(!user){say('يرجى تسجيل الدخول لاستخدام الرسائل.');const a=document.createElement('a');a.href='auth.html?next='+encodeURIComponent('messages.html'+location.search);a.textContent='Sign in';status.append(' ',a);return}await list();const listing=new URLSearchParams(location.search).get('listing');if(listing){if(!/^[1-9]\d{0,17}$/.test(listing))throw Error('Invalid listing');const matching=all.filter(c=>String(c.product_id)===listing);if(matching.length===1)await open(matching[0].id)}const id=new URLSearchParams(location.search).get('product');if(id){if(!/^[1-9]\d{0,17}$/.test(id))throw Error('Invalid product');const {data,error}=await db.rpc('oldora_start_conversation',{p_product_id:Number(id)});if(error){if(/cannot message yourself/i.test(error.message||'')){say('هذا إعلانك. يمكن للمشترين بدء المحادثة من صفحة المنتج، وستظهر رسائلهم هنا.');return}throw error}await list();await open(data)}say('')}catch(e){err(e);if(/relation|schema cache|function .*does not exist/i.test(e.message||''))say('Messaging is being prepared. Please check back later.')}})();
</script><script defer src="oldora-i18n.js?v=20261115chat-clean-v5"></script></body></html>
