<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Product Preview | OLDORA</title>
<style>
:root{--gold:#c4a46a;--line:#5c4b32;--bg:#101010;--panel:#1b1916;--cream:#f5f0e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Arial,sans-serif}header{padding:20px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.logo{font:bold clamp(22px,5vw,32px) Georgia,serif;letter-spacing:3px;color:var(--gold);text-decoration:none}a{color:var(--gold)}main{max-width:1050px;margin:auto;padding:22px 18px 70px}.banner{padding:12px 18px;text-align:center;background:#372c1d;color:#f5dbac;font-size:14px;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:25px}.photo{aspect-ratio:4/3;display:grid;place-items:center;background:#24211e;border:1px solid var(--line);border-radius:12px;font-size:clamp(90px,18vw,170px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}h1{font: bold clamp(28px,5vw,43px) Georgia,serif;color:var(--gold);margin:0 0 20px}.price{font-size:25px;font-weight:bold;color:var(--gold)}.muted{color:#d0c1a7;line-height:1.7}.button{display:inline-block;padding:13px 19px;border-radius:7px;border:1px solid var(--gold);background:var(--gold);color:#15110b;text-decoration:none;font-weight:bold;margin-top:15px;cursor:pointer;font-size:15px}.button.secondary{background:transparent;color:var(--gold)}.actions{display:flex;flex-wrap:wrap;gap:10px}.chat{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.chat textarea{width:100%;min-height:110px;padding:12px;border-radius:8px;background:#26231f;color:var(--cream);border:1px solid var(--line);font:16px Arial,sans-serif}.chat label{display:block;margin-bottom:8px}.chat[hidden]{display:none}.note{color:#d0c1a7;font-size:13px;line-height:1.6}#language{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:6px;padding:9px;cursor:pointer}@media(max-width:650px){.layout{grid-template-columns:1fr}header{padding:16px}.panel{padding:18px}}html[dir=rtl] .layout{text-align:right}</style></head>
<body><div class="banner" id="banner">DEMO PREVIEW — Sample listing only. No real product, sale, or messages.</div>
<header><a href="market-preview.html" class="logo">⌛ OLDORA</a><button id="language" type="button">العربية</button></header>
<main><a href="market-preview.html" id="back">← Back to collection</a><div class="layout"><div class="photo" id="photo" aria-label="Illustrative item image"></div><div class="panel"><h1 id="name"></h1><p class="price" id="price"></p><p class="muted" id="category"></p><p class="muted" id="description"></p><div class="actions"><button type="button" class="button" id="chatButton">💬 Private Chat</button></div><div class="chat" id="chat" hidden><p class="note" id="chatNote">Illustrative private chat layout only. Nothing is sent or stored.</p><label id="label" for="body">Your message</label><textarea id="body" maxlength="2000" placeholder="Write a message..."></textarea><button class="button" type="button" id="send">Send Message</button><p class="note" id="feedback" role="status"></p></div></div></div></main>
<script>
const items=[
 {id:1,title:'Vintage Mechanical Watch',price:1250,category:'Vintage Watches & Clocks',emoji:'⌚',description:'Illustrative mechanical wristwatch. Seller condition, age evidence and repair history would appear here.'},
 {id:2,title:'Classic Film Camera',price:890,category:'Cameras & Photography',emoji:'📷',description:'Illustrative classic film camera. Real listings disclose condition and restoration.'},
 {id:3,title:'Antique Wooden Chair',price:1450,category:'Furniture & Home Décor',emoji:'🪑',description:'Illustrative wooden chair. Materials and provenance would appear in a real listing.'},
 {id:4,title:'Vintage Radio',price:650,category:'Vintage Electronics',emoji:'📻',description:'Illustrative vintage radio. Functionality and repairs would be disclosed by the seller.'},
 {id:5,title:'Classic Car Collectible',price:18500,category:'Classic Cars',emoji:'🚘',description:'Illustrative classic car. This is not a vehicle for sale.'},
 {id:6,title:'Retro Collectible',price:320,category:'Retro Collectibles',emoji:'🎮',description:'Illustrative retro collectible, age category 15–19 years.'}
];
const params=new URLSearchParams(location.search),item=items.find(x=>String(x.id)===params.get('id'))||items[0];
const $=id=>document.getElementById(id);let lang=localStorage.getItem('oldora_language')==='ar'?'ar':'en';
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').textContent=lang==='ar'?'English':'العربية';$('banner').textContent=lang==='ar'?'معاينة توضيحية — المنتج افتراضي، ولا توجد عمليات بيع أو رسائل حقيقية.':'DEMO PREVIEW — Sample listing only. No real product, sale, or messages.';$('back').textContent=lang==='ar'?'العودة إلى المقتنيات':'← Back to collection';$('name').textContent=item.title;$('photo').textContent=item.emoji;$('price').textContent='SAR '+item.price.toLocaleString('en-US');$('category').textContent=item.category;$('description').textContent=item.description;$('chatButton').textContent=lang==='ar'?'💬 محادثة خاصة':'💬 Private Chat';$('chatNote').textContent=lang==='ar'?'هذه معاينة لشكل المحادثة فقط. لن تُرسل الرسائل أو تُحفظ.':'Illustrative private chat layout only. Nothing is sent or stored.';$('label').textContent=lang==='ar'?'رسالتك':'Your message';$('body').placeholder=lang==='ar'?'اكتب رسالتك...':'Write a message...';$('send').textContent=lang==='ar'?'إرسال الرسالة':'Send Message';}
$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('oldora_language',lang);render()};
$('chatButton').onclick=()=>{$('chat').hidden=!$('chat').hidden;$('feedback').textContent=''};
$('send').onclick=()=>{$('feedback').textContent=lang==='ar'?'هذه تجربة شكلية فقط، لم تُرسل أي رسالة.':'Preview only — no message was sent.'};
render();
</script></body></html>
